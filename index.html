<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Canales en vivo · YouTube</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; background: #000; color: #bbb; font-family: Arial, sans-serif; }
    #playerArea { position: absolute; top: 0; left: 0; width: 100%; height: calc(100% - 24px); }
    #youtubePlayer, #playerArea iframe { display: block; width: 100%; height: 100%; border: 0; }
    footer { position: absolute; bottom: 0; left: 0; width: 100%; height: 24px; display: flex; align-items: center; justify-content: center; gap: 20px; font-size: 12px; }
    footer a { color: #bbb; text-decoration: underline; }
    footer a:focus { outline: 2px solid #fff; outline-offset: 2px; color: #fff; }
  </style>
</head>
<body>
  <div id="playerArea"><div id="youtubePlayer"></div></div>
  <footer aria-label="Información">
    <a href="privacy.html" target="_blank" rel="noopener">Privacidad</a>
    <a href="terms.html" target="_blank" rel="noopener">Términos</a>
  </footer>
  <script src="player.js" defer></script>
</body>
</html>
